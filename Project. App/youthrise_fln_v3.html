
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:var(--font-sans)}
.app{max-width:100%;padding:0 2px}
.hdr{background:#27500A;color:#C0DD97;padding:12px 14px;border-radius:12px;margin-bottom:12px;display:flex;align-items:center;gap:10px}
.hdr-logo{width:36px;height:36px;border-radius:50%;background:#97C459;display:flex;align-items:center;justify-content:center;font-size:17px;color:#27500A;flex-shrink:0}
.hdr-title{font-size:14px;font-weight:500;color:#C0DD99}
.hdr-sub{font-size:11px;color:#97C459;margin-top:1px}
.role-row{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-bottom:12px}
.rbtn{padding:10px 4px;border:1.5px solid var(--color-border-tertiary);border-radius:8px;background:var(--color-background-primary);cursor:pointer;text-align:center;font-size:11px;color:var(--color-text-secondary);font-weight:500;font-family:var(--font-sans);line-height:1.3}
.rbtn i{display:block;font-size:20px;margin-bottom:3px}
.rbtn.on{border-color:#3B6D11;background:#EAF3DE;color:#27500A}
.tabs{display:flex;gap:0;border-bottom:0.5px solid var(--color-border-tertiary);margin-bottom:12px;overflow-x:auto}
.tbtn{padding:8px 10px;font-size:12px;cursor:pointer;border:none;background:transparent;color:var(--color-text-secondary);border-bottom:2px solid transparent;margin-bottom:-1px;white-space:nowrap;font-family:var(--font-sans)}
.tbtn.on{color:#27500A;border-bottom-color:#3B6D11;font-weight:500}
.slbl{font-size:10px;font-weight:500;color:var(--color-text-tertiary);text-transform:uppercase;letter-spacing:.06em;margin:12px 0 7px}
.slbl:first-child{margin-top:0}
.cgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;margin-bottom:10px}
.mcard{background:var(--color-background-primary);border:0.5px solid var(--color-border-tertiary);border-radius:12px;padding:12px;cursor:pointer;transition:border-color .12s}
.mcard:hover{border-color:var(--color-border-secondary)}
.mcard i.mi{font-size:20px;display:block;margin-bottom:7px;color:var(--color-text-secondary)}
.mcard .mt{font-size:12px;font-weight:500;color:var(--color-text-primary);margin-bottom:2px}
.mcard .ms{font-size:11px;color:var(--color-text-secondary);line-height:1.4}
.bdg{display:inline-block;font-size:10px;padding:2px 8px;border-radius:99px;margin-top:6px;font-weight:500}
.bg{background:#EAF3DE;color:#27500A}
.bt{background:#E1F5EE;color:#085041}
.ba{background:#FAEEDA;color:#633806}
.bp{background:#EEEDFE;color:#3C3489}
.bb{background:#E6F1FB;color:#0C447C}
.bc{background:#FAECE7;color:#712B13}
.srow{display:grid;grid-template-columns:repeat(3,1fr);gap:7px;margin-bottom:12px}
.sc{background:var(--color-background-secondary);border-radius:8px;padding:10px;text-align:center}
.sn{font-size:20px;font-weight:500;color:var(--color-text-primary)}
.sl{font-size:10px;color:var(--color-text-secondary);margin-top:2px}
.acard{background:var(--color-background-primary);border:0.5px solid var(--color-border-tertiary);border-radius:12px;padding:12px;margin-bottom:8px;cursor:pointer}
.acard-h{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:5px}
.acard-t{font-size:12px;font-weight:500;color:var(--color-text-primary)}
.acard-b{font-size:12px;color:var(--color-text-secondary);line-height:1.5}
.rrow{display:flex;align-items:center;gap:10px;padding:10px 12px;border:0.5px solid var(--color-border-tertiary);border-radius:8px;margin-bottom:7px;cursor:pointer}
.rrow:hover{background:var(--color-background-secondary)}
.rrow .ri{font-size:17px;color:var(--color-text-secondary);flex-shrink:0}
.rrow .rt{font-size:12px;font-weight:500;color:var(--color-text-primary)}
.rrow .rs{font-size:11px;color:var(--color-text-secondary)}
.rrow .ra{margin-left:auto;font-size:13px;color:var(--color-text-tertiary)}
.chips{display:flex;gap:5px;flex-wrap:wrap;margin-bottom:10px}
.chip{padding:4px 11px;border-radius:99px;font-size:11px;font-weight:500;border:1px solid var(--color-border-tertiary);cursor:pointer;background:var(--color-background-primary);color:var(--color-text-secondary);font-family:var(--font-sans)}
.chip.on{background:#E1F5EE;border-color:#0F6E56;color:#085041}
.lbtn{padding:4px 11px;border-radius:99px;font-size:11px;font-weight:500;border:1px solid var(--color-border-secondary);cursor:pointer;background:var(--color-background-primary);color:var(--color-text-secondary);font-family:var(--font-sans)}
.lbtn.on{background:#FAEEDA;border-color:#854F0B;color:#633806}
.lrow{display:flex;gap:6px;margin-bottom:10px;flex-wrap:wrap}
.lbox{background:var(--color-background-primary);border:0.5px solid var(--color-border-tertiary);border-radius:12px;padding:14px;margin-bottom:10px}
.lhdr{display:flex;align-items:center;gap:8px;margin-bottom:10px}
.backb{background:none;border:none;cursor:pointer;color:var(--color-text-secondary);font-size:17px;padding:2px;font-family:var(--font-sans)}
.ltitle{font-size:13px;font-weight:500;color:var(--color-text-primary)}
.pbar{height:4px;background:var(--color-background-secondary);border-radius:99px;margin-bottom:12px;overflow:hidden}
.pfill{height:100%;background:#3B6D11;border-radius:99px;transition:width .3s}
.qtxt{font-size:13px;color:var(--color-text-primary);margin-bottom:12px;line-height:1.6}
.choices{display:flex;flex-direction:column;gap:6px}
.chbtn{padding:9px 12px;border:1px solid var(--color-border-secondary);border-radius:8px;background:var(--color-background-primary);text-align:left;cursor:pointer;font-size:12px;color:var(--color-text-primary);font-family:var(--font-sans)}
.chbtn:hover{background:var(--color-background-secondary)}
.chbtn.cor{background:#EAF3DE;border-color:#3B6D11;color:#27500A;cursor:default}
.chbtn.wrg{background:#FAECE7;border-color:#993C1D;color:#712B13;cursor:default}
.fbbox{padding:9px 12px;border-radius:8px;font-size:12px;margin-top:9px;display:none;line-height:1.5}
.fbbox.ok{display:block;background:#EAF3DE;color:#27500A}
.fbbox.bad{display:block;background:#FAECE7;color:#712B13}
.navrow{display:flex;justify-content:flex-end;gap:8px;margin-top:12px}
.donew{text-align:center;padding:1.5rem 1rem}
</style>

<h2 class="sr-only">YouthRise Changemakers FLN learning app for teachers, young learners, and adults</h2>
<div class="app">
  <div class="hdr">
    <div class="hdr-logo"><i class="ti ti-plant-2" aria-hidden="true"></i></div>
    <div><div class="hdr-title">YouthRise Changemakers</div><div class="hdr-sub">Foundational Literacy & Numeracy</div></div>
  </div>
  <div class="role-row" id="rr">
    <button class="rbtn on" data-r="teacher"><i class="ti ti-school" aria-hidden="true"></i>Teacher</button>
    <button class="rbtn" data-r="learner"><i class="ti ti-abc" aria-hidden="true"></i>Young Learner</button>
    <button class="rbtn" data-r="adult"><i class="ti ti-users" aria-hidden="true"></i>Adult</button>
  </div>
  <div class="tabs" id="tb"></div>
  <div id="pn"></div>
</div>

<script>
var S={role:'teacher',tab:0,lesson:null,step:0,score:0,answered:false,lang:'sw',level:'emerging'};

var TABS={teacher:['Dashboard','PD Modules','Lesson Plans','Resources'],learner:['My Level','Learn','Practice','Progress'],adult:['Dashboard','Literacy','Numeracy','Digital Skills']};

var QUIZ={
  beginners:[
    {q:'What letter is this? → A',ch:['A','B','C','D'],a:0,fb:'This is A! In Swahili: A kama Asubuhi.'},
    {q:'How many dots? ● ● ●',ch:['2','3','4','5'],a:1,fb:'3 dots. Tatu in Swahili!'},
    {q:'Which word starts with B?',ch:['Cat','Ball','Apple','Dog'],a:1,fb:'Ball starts with B! Mpira in Swahili.'}
  ],
  emerging:[
    {q:'Read: C-A-T. What is it?',ch:['Car','Cup','Cat','Can'],a:2,fb:'Cat! Paka in Swahili.'},
    {q:'What is 2 + 3?',ch:['4','5','6','7'],a:1,fb:'2+3=5. Mbili na tatu ni tano!'},
    {q:'Which is a vowel?',ch:['B','C','A','D'],a:2,fb:'A is a vowel! A E I O U.'}
  ],
  developing:[
    {q:'"The dog runs fast." What does the dog do?',ch:['Sleeps','Eats','Runs','Jumps'],a:2,fb:'Runs! Great reading.'},
    {q:'Mama has 10 mangoes, gives 4 away. How many left?',ch:['4','5','6','7'],a:2,fb:'10-4=6. Sita zimesalia!'},
    {q:'Which word rhymes with BAT?',ch:['Box','Hat','Bun','Hop'],a:1,fb:'Bat and Hat both end in -AT!'}
  ],
  advancing:[
    {q:'"The children _____ to school every day."',ch:['goes','go','went','going'],a:1,fb:'"Go" is correct — children is plural.'},
    {q:'50 oranges, sold 23. How many remain?',ch:['27','37','33','17'],a:0,fb:'50-23=27. Excellent!'},
    {q:'Opposite of "happy"?',ch:['Sad','Fast','Tall','Loud'],a:0,fb:'Sad. Huzuni in Swahili.'}
  ]
};
var AQUIZ=[
  {q:'To check M-PESA balance, dial:',ch:['*100#','*334#','*111#','*200#'],a:1,fb:'Dial *334# then press call!'},
  {q:'You give 100 KES for a 50 KES item. Change?',ch:['40 KES','50 KES','60 KES','30 KES'],a:1,fb:'100-50=50 shillings change.'},
  {q:'Someone calls asking for your M-PESA PIN. You:',ch:['Tell them','Hang up — it is a scam','Send money','Give your number'],a:1,fb:'NEVER share your PIN! Usimwambie mtu PIN yako.'}
];

function getSteps(){return S.role==='adult'?AQUIZ:(QUIZ[S.level]||QUIZ.emerging);}

function go(){renderTabs();renderPanel();}

function renderTabs(){
  document.getElementById('tb').innerHTML=TABS[S.role].map(function(t,i){
    return '<button class="tbtn'+(i===S.tab?' on':'')+'" data-i="'+i+'">'+t+'</button>';
  }).join('');
}

function renderPanel(){
  var fns=[
    [tDash,tPD,tLessons,tResources],
    [lLevel,lLearn,lPractice,lProgress],
    [aDash,aLiteracy,aNumeracy,aDigital]
  ];
  var ri={teacher:0,learner:1,adult:2}[S.role];
  document.getElementById('pn').innerHTML=(fns[ri][S.tab]||function(){return '';})();
}

function tDash(){return '<div class="srow"><div class="sc"><div class="sn">7</div><div class="sl">Modules done</div></div><div class="sc"><div class="sn">24</div><div class="sl">Learners</div></div><div class="sc"><div class="sn">82%</div><div class="sl">Avg score</div></div></div><div class="slbl">Continue learning</div><div class="acard" data-action="lesson" data-val="Language of Instruction"><div class="acard-h"><div class="acard-t">Language of Instruction — Module 3</div><span class="bdg ba">In progress</span></div><div class="acard-b">Using mother tongue in early grade classrooms.</div></div><div class="slbl">Upcoming</div><div class="acard"><div class="acard-h"><div class="acard-t">Peer Learning Circle — Week 4</div><span class="bdg bb">Scheduled</span></div><div class="acard-b">Monthly refresher and coaching debrief.</div></div>';}

function tPD(){
  var ms=[
    {i:'ti-book-2',t:'FLN Pedagogy Foundations',s:'TaRL level-based approach',b:'bg'},
    {i:'ti-language',t:'Language of Instruction',s:'Swahili, English & mother tongue',b:'ba'},
    {i:'ti-target',t:'Assessment for Learning',s:'Simple diagnostic tools',b:'bt'},
    {i:'ti-users',t:'Inclusive Teaching',s:'Reaching every learner',b:'bp'},
    {i:'ti-layout-grid',t:'Classroom Management',s:'1:10 ratio strategies',b:'bb'},
    {i:'ti-certificate',t:'Capstone Assessment',s:'YouthRise FLN cert',b:'bc'}
  ];
  return '<div class="slbl">Professional development modules</div><div class="cgrid">'+ms.map(function(m){
    return '<div class="mcard" data-action="lesson" data-val="'+m.t+'"><i class="ti '+m.i+' mi" aria-hidden="true"></i><div class="mt">'+m.t+'</div><div class="ms">'+m.s+'</div><span class="bdg '+m.b+'">Start</span></div>';
  }).join('')+'</div>';
}

function tLessons(){
  var ls=[{t:'Phonics — Letter A sounds',d:'30 min',lv:'Beginners'},{t:'Number recognition 1–10',d:'25 min',lv:'Beginners'},{t:'Simple word reading',d:'35 min',lv:'Emerging'},{t:'Addition using objects',d:'30 min',lv:'Developing'},{t:'Story time — comprehension',d:'40 min',lv:'Advancing'}];
  return '<div class="lrow"><button class="lbtn'+(S.lang==='en'?' on':'')+'" data-action="lang" data-val="en">English</button><button class="lbtn'+(S.lang==='sw'?' on':'')+'" data-action="lang" data-val="sw">Kiswahili</button><button class="lbtn'+(S.lang==='mt'?' on':'')+'" data-action="lang" data-val="mt">Mother tongue</button></div><div class="slbl">Lesson plans</div>'+ls.map(function(r){return '<div class="rrow" data-action="lesson" data-val="'+r.t+'"><i class="ti ti-file-text ri" aria-hidden="true"></i><div><div class="rt">'+r.t+'</div><div class="rs">'+r.d+' · '+r.lv+'</div></div><i class="ti ti-chevron-right ra" aria-hidden="true"></i></div>';}).join('');
}

function tResources(){
  var rs=[{i:'ti-external-link',t:'TaRL Africa Toolkit',s:'Level-based assessment guides',u:'https://www.teachingattherightlevel.org'},{i:'ti-external-link',t:'Uwezo Assessments',s:'Annual measurement tools',u:'https://uwezo.net'},{i:'ti-external-link',t:'PAL Network',s:"People's Action for Learning",u:'https://www.palnetwork.org'},{i:'ti-download',t:'YouthRise Teacher Manual',s:'Full PD handbook',u:'#'},{i:'ti-download',t:'Porridge Program Guide',s:'Nutrition + attendance',u:'#'}];
  return '<div class="slbl">Partner resources</div>'+rs.map(function(r){return '<div class="rrow" data-action="ext" data-val="'+r.u+'"><i class="ti '+r.i+' ri" aria-hidden="true"></i><div><div class="rt">'+r.t+'</div><div class="rs">'+r.s+'</div></div><i class="ti ti-chevron-right ra" aria-hidden="true"></i></div>';}).join('');
}

function lLevel(){
  var lvls=['beginners','emerging','developing','advancing'];
  var desc={beginners:'Learn letters and numbers through songs and pictures.',emerging:'We can name letters. Now we make words!',developing:'We read simple words. Now short sentences!',advancing:'Almost ready for Grade 1!'};
  return '<div class="slbl">My level</div><div class="chips">'+lvls.map(function(l){return '<button class="chip'+(S.level===l?' on':'')+'" data-action="level" data-val="'+l+'">'+l.charAt(0).toUpperCase()+l.slice(1)+'</button>';}).join('')+'</div><div class="acard"><div class="acard-h"><div class="acard-t">Level: '+S.level.charAt(0).toUpperCase()+S.level.slice(1)+'</div><span class="bdg bt">Active</span></div><div class="acard-b">'+desc[S.level]+'</div><div style="margin-top:7px"><span class="bdg bg">Uwezo aligned</span> <span class="bdg ba">Max 10 learners</span></div></div><div class="slbl">Today</div><div class="acard"><div class="acard-t" style="margin-bottom:4px">Good morning! Learning time.</div><div class="acard-b">Get your porridge first, then find your group!</div></div>';
}

function lLearn(){
  if(S.lesson) return lessonView();
  var ms=[{i:'ti-alphabet-latin',t:'Reading & Letters',s:'Phonics and words',b:'bg'},{i:'ti-123',t:'Numbers & Counting',s:'Numeracy basics',b:'bt'},{i:'ti-palette',t:'Stories & Songs',s:'Swahili & English',b:'ba'},{i:'ti-puzzle',t:'Fun Activities',s:'Games and challenges',b:'bp'}];
  return '<div class="slbl">Choose a topic</div><div class="cgrid">'+ms.map(function(m){return '<div class="mcard" data-action="lesson" data-val="'+m.t+'"><i class="ti '+m.i+' mi" aria-hidden="true"></i><div class="mt">'+m.t+'</div><div class="ms">'+m.s+'</div><span class="bdg '+m.b+'">Start</span></div>';}).join('')+'</div>';
}

function lPractice(){
  if(S.lesson) return lessonView();
  return '<div class="slbl">Practice — '+S.level+'</div><div class="acard" data-action="lesson" data-val="Practice Quiz"><div class="acard-h"><div class="acard-t">Start practice quiz</div><span class="bdg bg">3 questions</span></div><div class="acard-b">Short quiz for your '+S.level+' level. About 5 minutes.</div></div><div class="acard"><div class="acard-h"><div class="acard-t">Flashcard drill</div><span class="bdg bt">Letters & Numbers</span></div><div class="acard-b">Tap through letter-sound and number flashcards.</div></div>';
}

function lProgress(){
  return '<div class="srow"><div class="sc"><div class="sn">12</div><div class="sl">Sessions</div></div><div class="sc"><div class="sn">75%</div><div class="sl">Quiz avg</div></div><div class="sc"><div class="sn">3</div><div class="sl">Stars</div></div></div><div class="slbl">Achievements</div><div class="acard"><div class="acard-h"><div class="acard-t">First quiz complete!</div><span class="bdg ba">Earned</span></div></div><div class="acard"><div class="acard-h"><div class="acard-t">Read 5 words in a row</div><span class="bdg bg">Earned</span></div></div><div class="acard"><div class="acard-h"><div class="acard-t">Counted to 20</div><span class="bdg bt">Earned</span></div></div>';
}

function aDash(){return '<div class="srow"><div class="sc"><div class="sn">5</div><div class="sl">Sessions</div></div><div class="sc"><div class="sn">3</div><div class="sl">Modules</div></div><div class="sc"><div class="sn">2</div><div class="sl">Skills</div></div></div><div class="slbl">Next session</div><div class="acard"><div class="acard-h"><div class="acard-t">Wednesday evening</div><span class="bdg bg">Upcoming</span></div><div class="acard-b">Topic: Checking M-PESA balance and reading transaction messages.</div></div><div class="slbl">Tip of the day</div><div class="acard"><div class="acard-b">Always check your M-PESA balance before and after a transaction. Angalia salio lako kila wakati.</div></div>';}

function aLiteracy(){
  if(S.lesson) return lessonView();
  var rs=[{i:'ti-writing',t:'Write your name',s:'Start with your signature'},{i:'ti-road-sign',t:'Read signs & labels',s:'Common signs around you'},{i:'ti-message',t:'Read SMS messages',s:'Phone texts step by step'},{i:'ti-file-invoice',t:'Read receipts & prices',s:'Market and shop literacy'}];
  return '<div class="lrow"><button class="lbtn'+(S.lang==='en'?' on':'')+'" data-action="lang" data-val="en">English</button><button class="lbtn'+(S.lang==='sw'?' on':'')+'" data-action="lang" data-val="sw">Kiswahili</button></div><div class="slbl">Literacy skills</div>'+rs.map(function(r){return '<div class="rrow" data-action="lesson" data-val="'+r.t+'"><i class="ti '+r.i+' ri" aria-hidden="true"></i><div><div class="rt">'+r.t+'</div><div class="rs">'+r.s+'</div></div><i class="ti ti-chevron-right ra" aria-hidden="true"></i></div>';}).join('');
}

function aNumeracy(){
  if(S.lesson) return lessonView();
  var rs=[{i:'ti-currency-dollar',t:'Counting money',s:'Notes, coins and change'},{i:'ti-receipt',t:'Checking prices & receipts',s:'Avoid being overcharged'},{i:'ti-building-store',t:'Business record keeping',s:'Simple daily records'},{i:'ti-plus',t:'Addition & subtraction',s:'Daily life calculations'}];
  return '<div class="slbl">Numeracy for everyday life</div>'+rs.map(function(r){return '<div class="rrow" data-action="lesson" data-val="'+r.t+'"><i class="ti '+r.i+' ri" aria-hidden="true"></i><div><div class="rt">'+r.t+'</div><div class="rs">'+r.s+'</div></div><i class="ti ti-chevron-right ra" aria-hidden="true"></i></div>';}).join('');
}

function aDigital(){
  if(S.lesson) return lessonView();
  var ms=[{i:'ti-phone-call',t:'Make & receive a call',s:'Step by step',b:'bg'},{i:'ti-search',t:'Find a contact',s:'Search phonebook',b:'bt'},{i:'ti-device-mobile',t:'Check M-PESA balance',s:'*334# explained',b:'ba'},{i:'ti-transfer',t:'Send M-PESA safely',s:'Confirm before sending',b:'bb'},{i:'ti-shield-check',t:'Avoid M-PESA scams',s:'Common fraud to watch',b:'bc'},{i:'ti-message-circle',t:'Read & send SMS',s:'Basic text messaging',b:'bp'}];
  return '<div class="slbl">Digital & mobile literacy</div><div class="cgrid">'+ms.map(function(m){return '<div class="mcard" data-action="lesson" data-val="'+m.t+'"><i class="ti '+m.i+' mi" aria-hidden="true"></i><div class="mt">'+m.t+'</div><div class="ms">'+m.s+'</div><span class="bdg '+m.b+'">Learn</span></div>';}).join('')+'</div>';
}

function lessonView(){
  var steps=getSteps();
  if(S.step>=steps.length) return doneView(steps.length);
  var s=steps[S.step],pct=Math.round(S.step/steps.length*100);
  return '<div class="lbox"><div class="lhdr"><button class="backb" data-action="back" aria-label="Back"><i class="ti ti-arrow-left" aria-hidden="true"></i></button><div class="ltitle">'+S.lesson+'</div></div><div class="pbar"><div class="pfill" style="width:'+pct+'%"></div></div><div class="qtxt">'+s.q+'</div><div class="choices">'+s.ch.map(function(c,i){return '<button class="chbtn" data-action="ans" data-idx="'+i+'" data-cor="'+s.a+'" data-fb="'+encodeURIComponent(s.fb)+'">'+c+'</button>';}).join('')+'</div><div class="fbbox" id="fbbox"></div><div class="navrow"><button data-action="next" id="nxtbtn" style="display:none">'+(S.step+1<steps.length?'Next →':'Finish ✓')+'</button></div></div>';
}

function doneView(total){
  var pct=Math.round(S.score/total*100);
  return '<div class="lbox"><div class="lhdr"><button class="backb" data-action="back" aria-label="Back"><i class="ti ti-arrow-left" aria-hidden="true"></i></button><div class="ltitle">Session complete!</div></div><div class="donew"><i class="ti ti-trophy" style="font-size:38px;color:#BA7517;display:block;margin-bottom:10px" aria-hidden="true"></i><div style="font-size:24px;font-weight:500;margin-bottom:5px">'+S.score+' / '+total+'</div><div style="font-size:12px;color:var(--color-text-secondary);margin-bottom:14px">'+(pct>=67?'Great work! Keep going!':'Good try! Let\'s practice more.')+'</div><span class="bdg bg" style="font-size:12px;padding:5px 14px">'+pct+'%</span></div><div class="navrow"><button data-action="back">Back to modules</button> <button data-action="retry">Try again</button></div></div>';
}

document.addEventListener('click', function(e){
  var el=e.target.closest('[data-action]');
  if(!el) return;
  var act=el.dataset.action, val=el.dataset.val;

  if(act==='role'){
    S.role=val; S.tab=0; S.lesson=null;
    document.querySelectorAll('.rbtn').forEach(function(b){b.classList.toggle('on',b.dataset.r===val);});
    go(); return;
  }
  if(act==='tab'){
    S.tab=parseInt(val); S.lesson=null; S.answered=false;
    go(); return;
  }
  if(act==='lesson'){
    S.lesson=val; S.step=0; S.score=0; S.answered=false;
    renderPanel(); return;
  }
  if(act==='lang'){S.lang=val; renderPanel(); return;}
  if(act==='level'){S.level=val; renderPanel(); return;}
  if(act==='back'){S.lesson=null; S.step=0; S.answered=false; renderPanel(); return;}
  if(act==='retry'){S.step=0; S.score=0; S.answered=false; renderPanel(); return;}
  if(act==='next'){
    S.step++; S.answered=false;
    renderPanel(); return;
  }
  if(act==='ans'){
    if(S.answered) return;
    S.answered=true;
    var idx=parseInt(el.dataset.idx), cor=parseInt(el.dataset.cor), fb=decodeURIComponent(el.dataset.fb);
    if(idx===cor) S.score++;
    document.querySelectorAll('.chbtn').forEach(function(b,i){
      b.disabled=true;
      if(i===cor) b.classList.add('cor');
      else if(i===idx) b.classList.add('wrg');
    });
    var fbbox=document.getElementById('fbbox');
    if(fbbox){fbbox.className='fbbox '+(idx===cor?'ok':'bad'); fbbox.textContent=(idx===cor?'✓ ':'✗ ')+fb;}
    var nb=document.getElementById('nxtbtn');
    if(nb) nb.style.display='inline-block';
    return;
  }
  if(act==='ext'){openLink(val); return;}
});

document.getElementById('rr').querySelectorAll('.rbtn').forEach(function(b){b.dataset.action='role'; b.dataset.val=b.dataset.r;});
document.getElementById('tb').addEventListener('click', function(e){
  var b=e.target.closest('.tbtn');
  if(b){S.tab=parseInt(b.dataset.i); S.lesson=null; S.answered=false; go();}
});

go();
</script>
