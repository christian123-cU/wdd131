<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Temple Album - A collection of LDS Temple images">
  <meta name="author" content="David Oduor">
  <title>Temple Album</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="preload" as="style" href="https://fonts.googleapis.com/css2?family=Lato:wght@400;700&family=Playfair+Display:wght@700&display=swap">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lato:wght@400;700&family=Playfair+Display:wght@700&display=swap" media="print" onload="this.media='all'">
  <noscript>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lato:wght@400;700&family=Playfair+Display:wght@700&display=swap">
  </noscript>

  <link rel="stylesheet" href="styles/temples.css">
  <link rel="stylesheet" href="styles/temples-large.css">
  <script src="scripts/temples.js" defer></script>
</head>
<body>

  <header>
    <div class="header-top">
      <h1>Temple Album</h1>
      <button type="button" id="menu">&#9776;</button>
    </div>
    <nav>
      <ul class="nav-links">
        <li><a href="#">Home</a></li>
        <li><a href="#">Old</a></li>
        <li><a href="#">New</a></li>
        <li><a href="#">Large</a></li>
        <li><a href="#">Small</a></li>
      </ul>
    </nav>
  </header>

  <main>
    <h2>Home</h2>
    <div class="gallery">
      <figure>
        <img src="https://picsum.photos/seed/temple1/400/300" alt="San Diego California Temple" width="400" height="300" loading="lazy">
        <figcaption>San Diego California</figcaption>
      </figure>
      <figure>
        <img src="https://picsum.photos/seed/temple2/400/300" alt="Salt Lake Temple" width="400" height="300" loading="lazy">
        <figcaption>Salt Lake City Utah</figcaption>
      </figure>
      <figure>
        <img src="https://picsum.photos/seed/temple3/400/300" alt="Nairobi Kenya Temple" width="400" height="300" loading="lazy">
        <figcaption>Nairobi Kenya</figcaption>
      </figure>
      <figure>
        <img src="https://picsum.photos/seed/temple4/400/300" alt="Provo Utah Temple" width="400" height="300" loading="lazy">
        <figcaption>Provo Utah</figcaption>
      </figure>
      <figure>
        <img src="https://picsum.photos/seed/temple5/400/300" alt="London England Temple" width="400" height="300" loading="lazy">

      </figure>
      <figure>
        <img src="https://picsum.photos/seed/temple6/400/300" alt="Rome Italy Temple" width="400" height="300" loading="lazy">
        <figcaption>Rome Italy</figcaption>
      </figure>
      <figure>
        <img src="https://picsum.photos/seed/temple7/400/300" alt="Tokyo Japan Temple" width="400" height="300" loading="lazy">

      </figure>
      <figure>
        <img src="https://picsum.photos/seed/temple8/400/300" alt="Sydney Australia Temple" width="400" height="300" loading="lazy">
        <figcaption>Sydney Australia</figcaption>
      </figure>
      <figure>
        <img src="https://picsum.photos/seed/temple9/400/300" alt="Mexico City Temple" width="400" height="300" loading="lazy">
        <figcaption>Mexico City Mexico</figcaption>
      </figure>
    </div>
  </main>

  <footer>
    <p>&copy;<span id="currentyear"></span> David Oduor | Nairobi, Kenya</p>
    <p id="lastModified"></p>
  </footer>

</body>
</html>
